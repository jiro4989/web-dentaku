<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>電卓</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="device" aria-label="電卓">
      <div class="device-top">
        <span class="screw" aria-hidden="true"></span>
        <div class="solar" aria-hidden="true"></div>
        <span class="screw" aria-hidden="true"></span>
      </div>
      <p class="brand">DENTAKU <span>JS-10</span></p>
      <div class="screen">
        <div id="display" class="lcd" role="status" aria-live="polite">0</div>
      </div>
      <div class="keypad">
        <button type="button" class="key key-fn key-ac" data-key="AC">AC</button>
        <button type="button" class="key key-fn" data-key="DEL">DEL</button>
        <button type="button" class="key key-fn" data-key="(">(</button>
        <button type="button" class="key key-fn" data-key=")">)</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-op" data-key="÷">÷</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-op" data-key="×">×</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-op" data-key="-">-</button>

        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key=".">.</button>
        <button type="button" class="key key-eq" data-key="=">=</button>
        <button type="button" class="key key-op" data-key="+">+</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
